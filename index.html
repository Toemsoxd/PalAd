<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmaré Pagó</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
        }
    </style>
</head>
<!-- 
  El body usa Flexbox en columna (flex-col). 
  Le ponemos bg-white por si la imagen es muy alta y deja huecos a los lados, 
  para que se fundan perfectamente con el blanco de los degradados.
-->
<body class="flex flex-col items-center justify-center h-screen w-full bg-white">

    <!-- 
      HUECO SUPERIOR: 
      - flex-grow: Ocupará automáticamente todo el espacio libre de arriba.
      - bg-gradient-to-b from-orange-500 to-white: Empieza naranja arriba y termina en blanco puro exactamente al tocar la imagen.
    -->
    <div class="w-full flex-grow min-h-0 bg-gradient-to-b from-orange-500 to-white"></div>
    
    <!-- 
      LA IMAGEN:
      - Al no tener object-fit global, la caja de la imagen será del tamaño exacto de la foto.
      - max-w-full y max-h-screen garantizan que crezca hasta los bordes sin desbordarse.
      - shrink asegura que si no hay espacio, la imagen se achique.
    -->
    <img 
        src="https://www.image2url.com/r2/default/images/1780095238642-fa24a5ce-0615-493c-9472-8632a02fa998.jpeg" 
        alt="Imagen principal" 
        class="max-w-full shrink min-h-0 object-contain"
        style="max-height: 100vh;"
        onerror="this.src='https://via.placeholder.com/800x600?text=Error+al+cargar+la+imagen'"
    >

    <!-- 
      HUECO INFERIOR: 
      - flex-grow: Ocupará automáticamente todo el espacio libre de abajo.
      - bg-gradient-to-t from-orange-500 to-white: Empieza naranja abajo y va "hacia arriba" (to top) terminando en blanco puro exactamente al tocar la imagen.
    -->
    <div class="w-full flex-grow min-h-0 bg-gradient-to-t from-orange-500 to-white"></div>

</body>
</html>
